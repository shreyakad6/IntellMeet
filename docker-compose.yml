services:
  # MongoDB Database Service
  mongodb:
    image: mongo:7.0
    container_name: intellmeet-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: intellmeet
    volumes:
      - mongodb_data:/data/db
    networks:
      - intellmeet-net

  # Optional Redis Cache Service
  redis:
    image: redis:7-alpine
    container_name: intellmeet-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - intellmeet-net

  # Backend API & Real-time WebRTC Signaling Server
  backend:
    build:
      context: ./server
      dockerfile: ../docker/Dockerfile.server
    container_name: intellmeet-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_URL: http://localhost
      MONGODB_URI: mongodb://mongodb:27017/intellmeet
      JWT_SECRET: super_secure_enterprise_jwt_secret_key_32_characters
      JWT_REFRESH_SECRET: super_secure_enterprise_refresh_jwt_key_32_chars
      DEMO_MODE: "true"
      GEMINI_API_KEY: ""
      GROQ_API_KEY: ""
      OPENAI_API_KEY: ""
      REDIS_URL: redis://redis:6379
      REDIS_ENABLED: "true"
      PROMETHEUS_METRICS_ENABLED: "true"
    depends_on:
      - mongodb
      - redis
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - intellmeet-net

  # Frontend Web Client
  frontend:
    build:
      context: ./client
      dockerfile: ../docker/Dockerfile.client
    container_name: intellmeet-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - intellmeet-net

volumes:
  mongodb_data:
  backend_uploads:

networks:
  intellmeet-net:
    driver: bridge

apiVersion: v1
kind: ConfigMap
metadata:
  name: intellmeet-config
  namespace: intellmeet
data:
  NODE_ENV: "production"
  PORT: "5000"
  CLIENT_URL: "https://intellmeet.company.com"
  MONGODB_URI: "mongodb://mongodb-service:27017/intellmeet"
  REDIS_URL: "redis://redis-service:6379"
  REDIS_ENABLED: "true"
  DEMO_MODE: "false"
  PROMETHEUS_METRICS_ENABLED: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: intellmeet-secrets
  namespace: intellmeet
type: Opaque
stringData:
  JWT_SECRET: "REPLACE_WITH_PRODUCTION_JWT_SECRET_KEY_32_CHARS"
  JWT_REFRESH_SECRET: "REPLACE_WITH_PRODUCTION_JWT_REFRESH_SECRET_32_CHARS"
  OPENAI_API_KEY: ""

# Prometheus Scrape Configuration for IntellMeet
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'intellmeet-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:5000', 'localhost:5000']
        labels:
          app: 'intellmeet'
          env: 'production'
